<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orcha — sign in</title>
<style>
  :root {
    --bg: #0b0d10; --panel: #12151a; --line: #232830;
    --text: #f2f4f7; --muted: #9aa3b2; --accent: #6c5ce7;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(108,92,231,.14), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(108,92,231,.08), transparent 55%),
      var(--bg);
    color: var(--text);
    font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; place-items: center; padding: 24px;
  }
  .card {
    width: min(420px, 100%);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 44px 40px 36px;
    text-align: center;
  }
  .mark {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px; letter-spacing: .35em; text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    margin: 10px 0 6px;
    font-size: 44px; font-weight: 750; letter-spacing: -.02em;
  }
  h1 .dot { color: var(--accent); }
  .tag { color: var(--muted); font-size: 15px; margin-bottom: 34px; }
  .gh-btn {
    display: inline-flex; align-items: center; gap: 10px; width: 100%;
    justify-content: center;
    padding: 13px 18px; border-radius: 10px;
    background: var(--text); color: #0b0d10;
    font-weight: 650; font-size: 15px; text-decoration: none;
    border: 1px solid transparent;
    transition: transform .06s ease, box-shadow .12s ease;
  }
  .gh-btn:hover { box-shadow: 0 6px 24px rgba(108,92,231,.25); transform: translateY(-1px); }
  .gh-btn svg { width: 20px; height: 20px; }
  .fine {
    margin-top: 26px; font-size: 12.5px; color: var(--muted);
  }
  .fine code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .rule { height: 1px; background: var(--line); margin: 30px 0 22px; }
  .foot { font-size: 12px; color: var(--muted); }
  .foot a { color: var(--muted); }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f7f9; --panel:#ffffff; --line:#e4e7ec; --text:#111418; --muted:#5b6472; }
    .gh-btn { background:#111418; color:#fff; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="mark">Human-authoritative agents</div>
    <h1>orcha<span class="dot">.</span></h1>
    <p class="tag">Your agents do the work.<br>You make the calls.</p>
    <a class="gh-btn" href="/oauth2/start?rd=%2F">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
        0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01
        1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95
        0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09
        2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87
        3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16
        8c0-4.42-3.58-8-8-8z"/>
      </svg>
      Continue with GitHub
    </a>
    <p class="fine">Access is limited to invited project members.<br>
    Signing in authorizes the <code>orcha-cloud-app</code> GitHub App.</p>
    <div class="rule"></div>
    <p class="foot">Powered by <a href="https://github.com/open-orcha/orcha">open-source Orcha</a> · sandboxed agents · human final call</p>
  </main>
</body>
</html>
