<!doctype html>

<head>
<meta charset="utf-8">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orcha · Projects</title>
<!-- pre-paint: theme attrs + inline bg/fg on <html> so the FIRST painted frame is
     already themed, even before any stylesheet arrives (kills the white nav flash;
     must stay ABOVE every <link rel="stylesheet">). The hardcoded colors mirror
     --bg/--text in styles/tokens.css (classic) and styles/responsive.css (swiss);
     the inline override is cleared once real CSS is live (DOMContentLoaded) so
     theme switching keeps sole ownership of the canvas color. -->
<script>(function(){try{var d=document.documentElement,t=localStorage.getItem('orcha:theme')||'auto',s=localStorage.getItem('orcha:skin'),b=localStorage.getItem('orcha:sidebar');d.setAttribute('data-theme',t);if(s&&s!=='classic')d.setAttribute('data-skin',s);if(b==='collapsed')d.setAttribute('data-sidebar','collapsed');var L=t==='light'||(t!=='dark'&&window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches),W=s==='swiss';d.style.backgroundColor=W?(L?'#f3f3f0':'#0e0e10'):(L?'#f3f6fa':'#0a0d12');d.style.color=W?(L?'#16161a':'#f2f2ee'):(L?'#0e1722':'#e8edf6');document.addEventListener('DOMContentLoaded',function(){d.style.backgroundColor='';d.style.color='';});}catch(e){document.documentElement.setAttribute('data-theme','auto');}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/assets/styles/components.css">
<link rel="stylesheet" href="/assets/styles/overlays.css">
<link rel="stylesheet" href="/assets/styles/conversation.css">
<link rel="stylesheet" href="/assets/styles/responsive.css">
<link rel="stylesheet" href="/assets/pages/projects.css">
</head>
<body>
<!-- The PROJECTS hub sits ABOVE any single project, so it renders its own light
     chrome (brand + account + theme) instead of the project sidebar/topbar. -->
<div class="proj-app">
  <header class="proj-top" id="projTop"></header>
  <main class="proj-main">
    <div class="proj-head">
      <h1>Projects</h1>
      <p class="sub" id="projSub">Everything you're a member of on this Orcha.</p>
    </div>
    <div class="proj-grid" id="projGrid">
      <div class="none" style="padding:30px">Loading projects…</div>
    </div>
  </main>
</div>
