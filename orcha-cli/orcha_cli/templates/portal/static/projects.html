<!-- pre-paint: theme attrs + inline bg/fg on <html> so the FIRST painted frame is
     already themed, even before any stylesheet arrives (kills the white nav flash;
     must stay ABOVE every <link rel="stylesheet">). The hardcoded colors mirror
     --bg/--text in styles/tokens.css (classic) and styles/responsive.css (swiss);
     the inline override is cleared once real CSS is live (DOMContentLoaded) so
     theme switching keeps sole ownership of the canvas color. -->
<script>(function(){try{var d=document.documentElement,t=localStorage.getItem('orcha:theme')||'auto',s=localStorage.getItem('orcha:skin'),b=localStorage.getItem('orcha:sidebar');d.setAttribute('data-theme',t);if(s&&s!=='classic')d.setAttribute('data-skin',s);if(b==='collapsed')d.setAttribute('data-sidebar','collapsed');var L=t==='light'||(t!=='dark'&&window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches),W=s==='swiss',M=s==='minimal';d.style.backgroundColor=M?(L?'#faf8f2':'#141414'):W?(L?'#f3f3f0':'#0e0e10'):(L?'#f3f6fa':'#0a0d12');d.style.color=M?(L?'#1a1a1a':'#f5f0e6'):W?(L?'#16161a':'#f2f2ee'):(L?'#0e1722':'#e8edf6');document.addEventListener('DOMContentLoaded',function(){d.style.backgroundColor='';d.style.color='';});}catch(e){document.documentElement.setAttribute('data-theme','auto');}})();</script>
<link rel="stylesheet" href="/assets/styles/fonts.css">

<!-- seamless nav (Chromium 121+): prerender same-origin link targets when the user
     hovers / presses a link ("moderate" eagerness), so the next page is already
     fetched, styled and scripted at click time. Document-rule ("where") form
     because every in-project nav link carries a per-project ?cid= query string —
     URL-list rules can't template queries, while href_matches "/*" leaves search
     params wildcarded. Excluded: /device* (that GET mints a device token),
     /oauth2/* (hovering sign-out must never sign out), /api/* and /assets/*
     (not navigable pages). Non-Chromium engines ignore this block entirely. -->
<script type="speculationrules">
{
  "prerender": [{
    "where": {
      "and": [
        { "href_matches": "/*" },
        { "not": { "href_matches": "/device*" } },
        { "not": { "href_matches": "/oauth2/*" } },
        { "not": { "href_matches": "/api/*" } },
        { "not": { "href_matches": "/assets/*" } }
      ]
    },
    "eagerness": "moderate"
  }]
}
</script>
</head>
<body>
<!-- The PROJECTS hub sits ABOVE any single project, so it renders its own light
     chrome (brand + account + theme) instead of the project sidebar/topbar. -->
<div class="proj-app">

  <main class="proj-main">
    <div class="proj-head">
      <h1>Projects</h1>
      <p class="sub" id="projSub">Everything you're a member of on this Orcha.</p>
    </div>
    <div class="proj-grid" id="projGrid">
      <div class="none" style="padding:30px">Loading projects…</div>
    </div>
  </main>
</div>
